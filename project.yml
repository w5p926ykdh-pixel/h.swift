
name: h

options:
  bundleIdPrefix: com.h

targets:
  CinoClient:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/H
    settings:
      base:
        PRODUCT_NAME: h
        PRODUCT_BUNDLE_IDENTIFIER: com.h.h
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"

schemes:
  h:
    build:
      targets:
        h: all
